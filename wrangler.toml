name = "read-later"
main = "src/index.js"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = false

# Converter container (fetch -> Readability -> images -> EPUB in one shot), run
# by percollate. Requires Workers Paid. instance_type sets vCPU/memory; Chromium
# wants headroom, so use standard-1 (4 GiB) and bump to standard-2 (6 GiB) if it
# OOMs. Single instance is plenty at this scale.
[[containers]]
class_name = "Archiver"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "ARCHIVER"
class_name = "Archiver"

# App state store (see Store in src/index.js): users (encrypted Drive refresh
# tokens + chosen folder) and per-user job status. A plain SQLite-backed DO, no
# namespace-create step and no id to manage: provisioned by `wrangler deploy`.
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Archiver"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobStore"]

# v3 renames JobStore -> Store (a fresh SQLite class; the old ephemeral job rows,
# which self-prune after 7 days, are not migrated). Going multi-user adds no new
# Durable Objects: Store just gains a users table alongside jobs.
[[migrations]]
tag = "v3"
deleted_classes = ["JobStore"]
new_sqlite_classes = ["Store"]

# Queue: the fetch handler enqueues, the same Worker consumes.
[[queues.producers]]
queue = "read-later"
binding = "QUEUE"

[[queues.consumers]]
queue = "read-later"
max_batch_size = 1
max_batch_timeout = 5
# Keep in sync with MAX_DELIVERY_ATTEMPTS in src/index.js (= max_retries + 1).
# There is no dead-letter queue: the consumer records a job "failed" itself on the
# final attempt (see the queue() catch block), so this count is load-bearing.
max_retries = 3

# Secrets/vars set via `wrangler secret bulk .env` (or `wrangler secret put <NAME>`):
# SESSION_SECRET (random; signs the session cookie and derives the refresh-token
# encryption key), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (shared OAuth client),
# ALLOWED_EMAILS (comma-separated login allowlist), GOOGLE_API_KEY (referrer-
# restricted Picker developer key), GOOGLE_PROJECT_NUMBER (Picker appId). Per-user
# Drive refresh tokens and folder are stored in the Store DO, not here.

name = "read-later"
main = "src/index.js"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

# Converter container (fetch -> Readability -> images -> EPUB in one shot), run
# by percollate. Requires Workers Paid. instance_type sets vCPU/memory; Chromium
# wants headroom, so use standard-1 (4 GiB) and bump to standard-2 (6 GiB) if it
# OOMs. Single instance is plenty at this scale.
[[containers]]
class_name = "Archiver"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "ARCHIVER"
class_name = "Archiver"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Archiver"]

# Queue: the fetch handler enqueues, the same Worker consumes.
[[queues.producers]]
queue = "read-later"
binding = "QUEUE"

[[queues.consumers]]
queue = "read-later"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

[vars]
BASIC_USER = "read"
# Secrets set via `wrangler secret put`: BASIC_PASS, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, DRIVE_FOLDER_ID.
